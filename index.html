<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>āPO — The Masterpiece Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=Prompt:wght@300;400;500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #142d52;
            --surface: #1c3b65;
            --fg: #d8eeff;
            --muted: #5a96c8;
            --gold: #c9a84c;
            --gold-glow: rgba(201, 168, 76, 0.3);
            --border: #244b6e;
            --font-th: 'Prompt', sans-serif;
            --font-serif: 'Cormorant Garamond', serif;
        }
        @supports (color: oklch(0% 0 0)) {
            :root {
                --bg: oklch(22% 0.07 240);
                --surface: oklch(28% 0.08 240);
                --fg: oklch(94% 0.03 220);
                --muted: oklch(63% 0.09 230);
                --gold: oklch(78% 0.10 85);
                --gold-glow: oklch(78% 0.10 85 / 0.3);
                --border: oklch(35% 0.08 235);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg); color: var(--fg); font-family: var(--font-th); 
            line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 0 16px; }

        @keyframes reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .reveal { animation: reveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        header { padding: 40px 0 20px; text-align: center; }
        .logo-wrap img { height: 300px; max-width: 100%; filter: brightness(1.2); transition: transform 0.3s; }
        .logo-wrap:hover img { transform: scale(1.05); }
        .tagline { font-size: 10px; letter-spacing: 0.5em; color: var(--gold); text-transform: uppercase; margin-top: 8px; font-weight: 300; }

        .sticky-top {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(20, 45, 82, 0.92); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); padding: 12px 0;
        }
        
        .tab-nav { display: flex; justify-content: center; gap: 24px; margin-bottom: 16px; }
        .tab-btn { 
            font-size: 14px; color: var(--muted); cursor: pointer; padding-bottom: 4px;
            transition: 0.3s; border-bottom: 1.5px solid transparent; font-weight: 400;
        }
        .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 500; }

        .search-container { position: relative; }
        .search-container input {
            width: 100%; background: var(--surface); border: 1px solid var(--border);
            color: var(--fg); padding: 12px 16px 12px 42px; font-size: 14px; border-radius: 12px;
            font-family: var(--font-th); transition: 0.3s;
        }
        .search-container input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-glow); }
        .search-container::before {
            content: '🔍'; position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            font-size: 14px; opacity: 0.4;
        }

        .chips-wrapper { 
            display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; 
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .chips-wrapper::-webkit-scrollbar { display: none; }
        .chip {
            white-space: nowrap; padding: 6px 16px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 20px; font-size: 12px;
            color: var(--muted); cursor: pointer; transition: 0.2s;
        }
        .chip.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }

        .fish-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 20px 0 120px;
        }

        .fish-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            overflow: hidden; display: flex; flex-direction: column; position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer;
        }
        .fish-card:active { transform: scale(0.96); }
        .fish-card.selected { border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.4); }

        /* การตั้งค่า Image Box ปรับปรุงให้รองรับความสูงสมบูรณ์แบบบนหน้าจอมือถือทุกรุ่น */
        .image-box { width: 100%; padding-top: 100%; background-size: cover; background-position: center; position: relative; }
        .image-box::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.5), transparent); }

        .select-indicator {
            position: absolute; top: 10px; right: 10px; width: 24px; height: 24px;
            border-radius: 50%; border: 1.5px solid var(--gold); z-index: 10;
            background: rgba(10, 15, 25, 0.6); display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .fish-card.selected .select-indicator { background: var(--gold); transform: scale(1.1); }
        .fish-card.selected .select-indicator::after { content: '✓'; color: var(--bg); font-size: 14px; font-weight: bold; }

        .card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
        .fish-name { font-size: 14px; font-weight: 500; line-height: 1.3; margin-bottom: 10px; height: 2.6em; overflow: hidden; }
        
        .price-tag { margin-top: auto; border-top: 1px solid var(--border); padding-top: 10px; }
        .total-price { font-size: 18px; color: var(--gold); font-weight: 600; font-family: 'Inter', sans-serif; }
        .per-kg { font-size: 10px; color: var(--muted); display: block; margin-top: -2px; }

        .source-tag { font-size: 10px; color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
        .source-tag::before { content: '📍'; font-size: 8px; }

        .order-dock {
            position: fixed; bottom: 24px; left: 16px; right: 16px;
            background: var(--surface); border: 1px solid var(--gold);
            border-radius: 16px; padding: 16px 20px; display: flex;
            align-items: center; justify-content: space-between;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); z-index: 2000;
            transform: translateY(150px); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .order-dock.active { transform: translateY(0); }
        .sum-price { font-size: 20px; color: var(--gold); font-weight: 600; font-family: 'Inter', sans-serif; }
        
        .order-btn {
            background: var(--gold); color: var(--bg); border: none; padding: 12px 28px;
            border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 15px var(--gold-glow); transition: 0.2s;
        }

        .modal {
            position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal.visible { display: flex; }
        .modal-content {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            width: 100%; max-width: 400px; padding: 24px; position: relative;
        }

        .loading-state { grid-column: 1/-1; padding: 100px 0; text-align: center; color: var(--gold); font-size: 16px; letter-spacing: 0.1em; }

        @media (min-width: 600px) {
            .fish-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
            .fish-name { font-size: 16px; }
            .total-price { font-size: 22px; }
        }
    </style>
</head>
<body>

    <header class="reveal">
        <div class="logo-wrap"><img src="mppkllsa-logo-apo.png" alt="āPO" onerror="this.src='https://via.placeholder.com/150x50/0d1626/ffffff?text=APO'"></div>
        <div class="tagline">The Michelin Standard Fishery</div>
    </header>

    <div class="sticky-top reveal" style="animation-delay: 0.1s">
        <div class="container">
            <div class="tab-nav">
                <div class="tab-btn active" id="tab-fish" onclick="switchTab('fish')">The Fish</div>
                <div class="tab-btn" id="tab-shell" onclick="switchTab('shell')">Shell & Sea</div>
            </div>
            <div class="search-container">
                <input type="text" id="search" placeholder="ค้นหาตามชื่อปลา หรือ แหล่งที่มา..." oninput="handleSearch()">
            </div>
            <div class="chips-wrapper">
                <div class="chip active" onclick="filterBy('all', this)">ทั้งหมด</div>
                <div class="chip" onclick="filterBy('หลีเป๊ะ', this)">จากหลีเป๊ะ</div>
                <div class="chip" onclick="filterBy('ภูเก็ต', this)">จากภูเก็ต</div>
            </div>
        </div>
    </div>

    <main class="container">
        <div id="catalog" class="fish-grid">
            <div id="loading-indicator" class="loading-state">
                กำลังเตรียมวัตถุดิบประจำวัน...
            </div>
        </div>
    </main>

    <div class="order-dock" id="order-dock">
        <div class="order-summary">
            <div class="item-count" id="dock-count">เลือกแล้ว 0 รายการ</div>
            <div class="sum-price" id="dock-total">0 ฿</div>
        </div>
        <button class="order-btn" onclick="showSummary()">สั่งซื้อสินค้า</button>
    </div>

    <div class="modal" id="order-modal">
        <div class="modal-content reveal">
            <h3 class="modal-title" style="font-size: 18px; font-weight: 600; margin-bottom: 20px; text-align: center; color: var(--gold);">สรุปรายการสั่งซื้อ</h3>
            <div id="summary-list" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px; border-bottom: 1px solid var(--border);"></div>
            <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 600; margin-bottom: 24px;">
                <span>ราคารวมโดยประมาณ</span>
                <span id="modal-total-price">0 ฿</span>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 12px;">
                <button onclick="closeSummary()" style="background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 12px; border-radius: 10px; cursor: pointer;">ยกเลิก</button>
                <button onclick="confirmOrder()" style="background: var(--gold); border: none; color: var(--bg); padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer;">ส่งเข้า Line</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxxjhG6wbxg9Okvui3_wW0DlUhxGXwPSP5aCOzeM7ahevlD4cYv4HicKsI3I5ilUTLK2A/exec";
        
        let allItems = [];
        let selected = new Set();
        let currentCat = 'fish';
        let query = '';
        let currentSource = 'all';

        function switchTab(cat) {
            currentCat = cat;
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + cat).classList.add('active');
            render();
        }

        function filterBy(source, el) {
            currentSource = source;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function handleSearch() {
            query = document.getElementById('search').value.toLowerCase();
            render();
        }

        function toggleItem(id) {
            if (selected.has(id)) selected.delete(id);
            else selected.add(id);
            render();
            updateDock();
        }

        function updateDock() {
            const dock = document.getElementById('order-dock');
            const countEl = document.getElementById('dock-count');
            const totalEl = document.getElementById('dock-total');
            
            if (selected.size > 0) {
                dock.classList.add('active');
                let total = 0;
                selected.forEach(id => {
                    const item = allItems.find(i => i.uniqueId === id);
                    if (item) {
                        const price = parseFloat(String(item.priceKg).replace(/,/g, '')) || 0;
                        const weight = parseFloat(item.weight) || 0;
                        total += (price * weight);
                    }
                });
                countEl.innerText = `เลือกแล้ว ${selected.size} รายการ`;
                totalEl.innerText = `${total.toLocaleString()} ฿`;
            } else {
                dock.classList.remove('active');
            }
        }

        function render() {
            if (allItems.length === 0) return;
            const root = document.getElementById('catalog');
            const targetCat = currentCat === 'fish' ? 'ปลา' : 'หอย/ทะเล';
            
            const filtered = allItems.filter(i => {
                const matchCat = i.category === targetCat;
                const matchSearch = i.name.toLowerCase().includes(query) || i.source.toLowerCase().includes(query);
                const matchSource = currentSource === 'all' || i.source.includes(currentSource);
                return matchCat && matchSearch && matchSource;
            });

            if (filtered.length === 0 && allItems.length > 0) {
                root.innerHTML = `<div class="loading-state" style="grid-column: 1/-1;">ไม่พบรายการที่ตรงตามเงื่อนไข</div>`;
                return;
            }

            root.innerHTML = filtered.map(i => `
                <div class="fish-card ${selected.has(i.uniqueId) ? 'selected' : ''}" onclick="toggleItem('${i.uniqueId}')">
                    <div class="select-indicator"></div>
                    <div class="image-box" style="background-image: url('${toImgUrl(i.image)}')"></div>
                    <div class="card-body">
                        <span class="source-tag">${i.source}</span>
                        <h3 class="fish-name">${i.name}</h3>
                        
                        <div class="price-tag">
                            <span class="per-kg">ราคา ${(parseFloat(String(i.priceKg).replace(/,/g, '')) || 0).toLocaleString()} ฿ / ${i.unit || 'กก.'} (น้ำหนัก ${i.weight} ${i.unit || 'กก.'})</span>
                            <span class="total-price">${((parseFloat(String(i.priceKg).replace(/,/g, '')) || 0) * (parseFloat(i.weight) || 0)).toLocaleString()} ฿</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ปรับปรุง URL รูปภาพ Google Drive ให้เป็น HTTPS ทั้งหมดเพื่อความปลอดภัยบนหน้าจอมือถือ
        function toImgUrl(url) {
            if (!url || url.indexOf('drive.google.com') === -1) return url || 'https://via.placeholder.com/400x400/0d1626/ffffff?text=āPO';
            var m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            return m ? 'https://drive.google.com/uc?export=view&id=' + m[1] : url;
        }

        function showSummary() {
            const modal = document.getElementById('order-modal');
            const list = document.getElementById('summary-list');
            const totalEl = document.getElementById('modal-total-price');
            
            let html = '';
            let total = 0;
            
            selected.forEach(id => {
                const item = allItems.find(i => i.uniqueId === id);
                if (item) {
                    const price = parseFloat(String(item.priceKg).replace(/,/g, '')) || 0;
                    const weight = parseFloat(item.weight) || 0;
                    const sum = price * weight;
                    total += sum;
                    html += `
                        <div style="display: flex; justify-content: space-between; font-size: 14px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                            <div style="flex: 1; padding-right: 10px;">
                                <div style="font-weight: 500;">${item.name}</div>
                                <div style="font-size: 11px; color: var(--muted);">${item.weight} ${item.unit || 'กก.'} (${price.toLocaleString()} ฿/กก.)</div>
                            </div>
                            <div style="font-weight: 600; color: var(--gold);">${sum.toLocaleString()} ฿</div>
                        </div>
                    `;
                }
            });
            
            list.innerHTML = html;
            totalEl.innerText = `${total.toLocaleString()} ฿`;
            modal.classList.add('visible');
        }

        function closeSummary() {
            document.getElementById('order-modal').classList.remove('visible');
        }

        function confirmOrder() {
            let msg = 'เชฟครับ ผมสนใจสั่งซื้อวัตถุดิบดังนี้ครับ:\n\n';
            let total = 0;
            selected.forEach(id => {
                const item = allItems.find(i => i.uniqueId === id);
                if (item) {
                    const price = parseFloat(String(item.priceKg).replace(/,/g, '')) || 0;
                    const weight = parseFloat(item.weight) || 0;
                    const sum = price * weight;
                    total += sum;
                    msg += `- ${item.name} (${item.weight} ${item.unit || 'กก.'}) : ${sum.toLocaleString()} ฿\n`;
                }
            });
            msg += `\nยอดรวมโดยประมาณ: ${total.toLocaleString()} ฿\nรบกวนเชฟยืนยันยอดและแจ้งการโอนเงินด้วยครับ`;
            window.open(`https://line.me/R/oaMessage/@885iivsu/?${encodeURIComponent(msg)}`);
        }

        function showError() {
            var el = document.getElementById('loading-indicator');
            if (el) el.innerHTML = 'เกิดข้อผิดพลาดในการโหลดข้อมูล <br><button onclick="location.reload()" style="margin-top:10px;background:var(--gold);border:none;padding:5px 15px;border-radius:4px;cursor:pointer;color:var(--bg);font-weight:600;">ลองใหม่อีกครั้ง</button>';
        }

        function processData(data) {
            if (!data || data.length === 0) return false;
            allItems = data.map(function(item, index) {
                return Object.assign({}, item, { uniqueId: (item.code || 'ITEM') + '-' + index });
            });
            render();
            return true;
        }

        function tryFetch() {
            fetch(API_URL + '?t=' + Date.now(), { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
                .then(function(r) { return r.json(); })
                .then(function(data) { processData(data); })
                .catch(function() {});
        }

        function loadData() {
            var done = false;
            var errorTimer = setTimeout(function() {
                if (!done) showError();
            }, 28000);

            function succeed() { done = true; clearTimeout(errorTimer); }

            // JSONP ไม่โดน CORS — callback ต้องอยู่จนกว่า GAS จะตอบ (cold start อาจนาน 15-18s)
            var cbName = '_apo_' + Date.now();

            window[cbName] = function(data) {
                delete window[cbName];
                if (!done && processData(data)) succeed();
            };

            var s = document.createElement('script');
            // ถ้า script โหลดไม่ได้เลย (network block) ให้ลอง fetch ทันที
            s.onerror = function() {
                delete window[cbName];
                if (!done) tryFetch();
            };
            s.src = API_URL + '?callback=' + cbName + '&t=' + Date.now();
            document.head.appendChild(s);

            // ถ้า 18s ผ่านไปแล้ว JSONP ยังไม่ตอบ → ลอง fetch คู่ขนาน (GAS cold start)
            setTimeout(function() {
                if (!done) tryFetch();
            }, 18000);
        }

        window.onload = loadData;
    </script>
</body>
</html>
